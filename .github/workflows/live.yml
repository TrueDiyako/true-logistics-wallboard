name: live-orders
on:
  schedule:
    # Backup only: GitHub delays or drops scheduled runs under load (seen: 1 of 13 ran on
    # 5 Oct). The hourly trigger is an external cron calling "Run workflow" (README).
    - cron: "23 4-16 * * 1-5"     # odd minute: less crowded than :00/:05
    - cron: "0 9 * * 0,6"         # once a day at weekends
  workflow_dispatch: {}
concurrency: { group: live, cancel-in-progress: false }   # queue, never kill a running update
jobs:
  live:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    defaults: { run: { working-directory: jobs } }
    env:
      TRACELINK_TOKEN: ${{ secrets.TRACELINK_TOKEN }}
      TENANT_ID: ${{ secrets.TENANT_ID }}
      CLIENT_ID: ${{ secrets.CLIENT_ID }}
      CLIENT_SECRET: ${{ secrets.CLIENT_SECRET }}
      APP_SECRET_TOKEN: ${{ secrets.APP_SECRET_TOKEN }}
      AGREEMENT_GRANT_TOKEN: ${{ secrets.AGREEMENT_GRANT_TOKEN }}
      DACHSER_API_KEY: ${{ secrets.DACHSER_API_KEY }}          # Hannover login
      DACHSER_API_KEY_DK: ${{ secrets.DACHSER_API_KEY_DK }}    # Denmark login(s) - optional
      DACHSER_API_KEY_DK2: ${{ secrets.DACHSER_API_KEY_DK2 }}
      DACHSER_API_KEY_DK3: ${{ secrets.DACHSER_API_KEY_DK3 }}
      BOOKING_WARNING: ${{ vars.BOOKING_WARNING }}             # "1" = red "book now" on dashboard 4
      WECLAPP_TOKEN: ${{ secrets.WECLAPP_TOKEN }}              # weclapp API token (read only is enough)
      KV_REST_API_URL: ${{ secrets.KV_REST_API_URL }}
      KV_REST_API_TOKEN: ${{ secrets.KV_REST_API_TOKEN }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: { python-version: "3.12" }
      - run: pip install openpyxl==3.1.5
      - name: Tests
        run: |
          KV_REST_API_URL= python test_production.py
          KV_REST_API_URL= python test_weclapp.py
          KV_REST_API_URL= python test_jobs.py
      - name: Build order lists and publish
        run: python live.py
