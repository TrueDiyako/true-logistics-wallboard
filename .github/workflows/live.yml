name: live-orders
on:
  schedule:
    - cron: "5 4-16 * * 1-5"      # every hour at :05, ~06:05-18:05 Copenhagen, Mon-Fri
    - cron: "0 9 * * 0,6"         # once a day at weekends
  workflow_dispatch: {}
concurrency: { group: live, cancel-in-progress: true }
jobs:
  live:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    defaults: { run: { working-directory: jobs } }
    env:
      TRACELINK_TOKEN: ${{ secrets.TRACELINK_TOKEN }}
      TENANT_ID: ${{ secrets.TENANT_ID }}
      CLIENT_ID: ${{ secrets.CLIENT_ID }}
      CLIENT_SECRET: ${{ secrets.CLIENT_SECRET }}
      APP_SECRET_TOKEN: ${{ secrets.APP_SECRET_TOKEN }}
      AGREEMENT_GRANT_TOKEN: ${{ secrets.AGREEMENT_GRANT_TOKEN }}
      DACHSER_API_KEY: ${{ secrets.DACHSER_API_KEY }}
      KV_REST_API_URL: ${{ secrets.KV_REST_API_URL }}
      KV_REST_API_TOKEN: ${{ secrets.KV_REST_API_TOKEN }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: { python-version: "3.12" }
      - name: Tests
        run: KV_REST_API_URL= python test_jobs.py
      - name: Build order lists and publish
        run: python live.py
