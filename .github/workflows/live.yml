name: live-orders
on:
  # Started by cron-job.org every 30 minutes, 07:00-16:30 Mon-Fri (README "Hourly trigger").
  # No GitHub schedule here: it is unreliable and would double the Actions minutes.
  workflow_dispatch: {}
concurrency: { group: live, cancel-in-progress: false }   # queue, never kill a running update
jobs:
  live:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    defaults: { run: { working-directory: jobs } }
    env:
      TRACELINK_TOKEN: ${{ secrets.TRACELINK_TOKEN }}
      TENANT_ID: ${{ secrets.TENANT_ID }}
      CLIENT_ID: ${{ secrets.CLIENT_ID }}
      CLIENT_SECRET: ${{ secrets.CLIENT_SECRET }}
      APP_SECRET_TOKEN: ${{ secrets.APP_SECRET_TOKEN }}
      AGREEMENT_GRANT_TOKEN: ${{ secrets.AGREEMENT_GRANT_TOKEN }}
      DACHSER_TT_47379200: ${{ secrets.DACHSER_TT_47379200 }}  # Track & Trace per Dachser customer number
      DACHSER_TT_72695099: ${{ secrets.DACHSER_TT_72695099 }}
      DACHSER_TT_47133021: ${{ secrets.DACHSER_TT_47133021 }}
      DACHSER_TT_47222882: ${{ secrets.DACHSER_TT_47222882 }}
      DACHSER_API_KEY: ${{ secrets.DACHSER_API_KEY }}          # Hannover login
      DACHSER_API_KEY_DK: ${{ secrets.DACHSER_API_KEY_DK }}    # Denmark login(s) - optional
      DACHSER_API_KEY_DK2: ${{ secrets.DACHSER_API_KEY_DK2 }}
      DACHSER_API_KEY_DK3: ${{ secrets.DACHSER_API_KEY_DK3 }}
      BOOKING_WARNING: ${{ vars.BOOKING_WARNING }}             # "1" = red "book now" on dashboard 4
      WECLAPP_TOKEN: ${{ secrets.WECLAPP_TOKEN }}              # weclapp API token (read only is enough)
      GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}   # reads the Claude skill logs
      DACHSER_NOTES_KEY: ${{ secrets.DACHSER_NOTES_KEY }}      # Hannover warehouse: delivery notes
      DACHSER_STATUS_KEY: ${{ secrets.DACHSER_STATUS_KEY }}    # Hannover warehouse: delivery-order status
      DACHSER_EVERY_MIN: ${{ vars.DACHSER_EVERY_MIN }}         # delivery-note check interval (default 60)
      KV_REST_API_URL: ${{ secrets.KV_REST_API_URL }}
      KV_REST_API_TOKEN: ${{ secrets.KV_REST_API_TOKEN }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: { python-version: "3.12" }
      - run: pip install openpyxl==3.1.5 google-auth==2.35.0 requests==2.32.3
      - name: Tests
        run: |
          KV_REST_API_URL= python test_production.py
          KV_REST_API_URL= python test_weclapp.py
          KV_REST_API_URL= python test_skill_usage.py
          KV_REST_API_URL= python test_dachser_notes.py
          KV_REST_API_URL= python test_jobs.py
      - name: Build order lists and publish
        run: python live.py
